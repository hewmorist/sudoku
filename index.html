<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5"><title>Sudoku V1</title>
<style>body{font-family:system-ui;margin:0;background:#f4f4f4;color:#222}header{position:sticky;top:0;z-index:5;background:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;border-bottom:1px solid #ccc}button,.pick{font:16px system-ui;padding:9px 12px;border:1px solid #999;border-radius:8px;background:#fff}.pick input{position:absolute;width:1px;height:1px;opacity:0}button.on{background:#222;color:#fff}main{max-width:850px;margin:auto;padding:10px}#paper{display:block;max-width:min(100%,480px);height:auto;margin:0 auto 18px}.board{width:min(94vw,600px);aspect-ratio:1;margin:auto;display:grid;grid-template-columns:repeat(9,1fr);background:#222;border:3px solid #222}.cell{position:relative;box-sizing:border-box;border-right:1px solid #999;border-bottom:1px solid #999;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(22px,5vw,38px);font-weight:600;user-select:none}.cell:nth-child(3n){border-right:3px solid #222}.cell:nth-child(9n){border-right:0}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:3px solid #222}.given{background:#f0f0f0;font-weight:800}.peer{background:#f3f3f3}.same{background:#e3e3e3}.selected{outline:4px solid #333;outline-offset:-4px;background:#ddd}.conflict{box-shadow:inset 0 0 0 5px #d00000;background:#ffd6d6!important}.notes{position:absolute;inset:3px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:clamp(8px,1.7vw,13px);font-weight:500;align-items:center;text-align:center}.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(94vw,600px);margin:12px auto}.pad button{font-size:20px}.help{font-size:14px;color:#555;text-align:center}@media print{header,.pad,.help{display:none!important}body{background:#fff}}</style></head><body>
<header><label class="pick">Open Puzzle<input id="open" type="file" accept=".json,application/json"></label><button id="resume">Resume Last</button><button id="save">Save Puzzle</button><button id="notesBtn">Notes</button><button id="clear">Clear Entries</button><button onclick="window.print()">Print</button><span id="status">Open a prepared Sudoku JSON.</span></header>
<main><img id="paper" hidden><div id="board" class="board" hidden></div><div id="pad" class="pad" hidden><button data-n="1">1</button><button data-n="2">2</button><button data-n="3">3</button><button data-n="4">4</button><button data-n="5">5</button><button data-n="6">6</button><button data-n="7">7</button><button data-n="8">8</button><button data-n="9">9</button><button data-n="0">⌫</button></div><p class="help">Tap a square, then a number. Notes mode adds/removes pencil marks. Red means a row, column or 3×3-box conflict.</p></main>
<script>
const $=x=>document.getElementById(x),board=$('board'),paper=$('paper'),status=$('status'),KEY='sudoku-v1';let image='',givens=[],values=[],notes=[],sel=null,noteMode=false;
function state(){return{version:1,type:'sudoku',image,givens,values,notes}}function auto(){try{localStorage.setItem(KEY,JSON.stringify(state()))}catch(e){}}
function conflict(r,c){let n=givens[r][c]||values[r][c];if(!n)return false;for(let i=0;i<9;i++){if(i!=c&&(givens[r][i]||values[r][i])==n)return true;if(i!=r&&(givens[i][c]||values[i][c])==n)return true}let br=r-r%3,bc=c-c%3;for(let y=br;y<br+3;y++)for(let x=bc;x<bc+3;x++)if((y!=r||x!=c)&&(givens[y][x]||values[y][x])==n)return true;return false}
function render(){board.innerHTML='';for(let r=0;r<9;r++)for(let c=0;c<9;c++){let d=document.createElement('div');d.className='cell';let n=givens[r][c]||values[r][c];if(givens[r][c])d.classList.add('given');if(sel){let [sr,sc]=sel;if(r==sr||c==sc||(Math.floor(r/3)==Math.floor(sr/3)&&Math.floor(c/3)==Math.floor(sc/3)))d.classList.add('peer');let sn=givens[sr][sc]||values[sr][sc];if(sn&&n==sn)d.classList.add('same');if(r==sr&&c==sc)d.classList.add('selected')}if(conflict(r,c))d.classList.add('conflict');if(n)d.textContent=n;else if(notes[r][c].length){let q=document.createElement('div');q.className='notes';for(let k=1;k<=9;k++){let z=document.createElement('span');z.textContent=notes[r][c].includes(k)?k:'';q.appendChild(z)}d.appendChild(q)}d.onclick=()=>{sel=[r,c];render()};board.appendChild(d)}board.hidden=false;$('pad').hidden=false;auto()}
function enter(n){if(!sel)return;let[r,c]=sel;if(givens[r][c])return;if(noteMode&&n){if(values[r][c])return;let a=notes[r][c],i=a.indexOf(n);i>=0?a.splice(i,1):a.push(n);a.sort()}else{values[r][c]=n;notes[r][c]=[]}render()}
document.querySelectorAll('#pad button').forEach(b=>b.onclick=()=>enter(+b.dataset.n));document.addEventListener('keydown',e=>{/^[1-9]$/.test(e.key)&&enter(+e.key);(e.key==='Backspace'||e.key==='Delete')&&enter(0)});
$('notesBtn').onclick=()=>{noteMode=!noteMode;$('notesBtn').classList.toggle('on',noteMode);$('notesBtn').textContent=noteMode?'Notes ON':'Notes'};
function restore(o){if(!o||o.type!=='sudoku')throw Error('Not a Sudoku puzzle file.');image=o.image||'';givens=o.givens;values=o.values||Array.from({length:9},()=>Array(9).fill(0));notes=o.notes||Array.from({length:9},()=>Array.from({length:9},()=>[]));if(image){paper.src=image;paper.hidden=false}sel=null;render();status.textContent='Puzzle opened.'}
$('open').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{restore(JSON.parse(r.result))}catch(err){status.textContent=err.message}};r.readAsText(f)};$('resume').onclick=()=>{try{let s=localStorage.getItem(KEY);s?restore(JSON.parse(s)):status.textContent='No saved puzzle.'}catch(e){status.textContent='Could not restore puzzle.'}};
$('save').onclick=()=>{if(!givens.length)return;let b=new Blob([JSON.stringify(state())],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sudoku.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};$('clear').onclick=()=>{values=Array.from({length:9},()=>Array(9).fill(0));notes=Array.from({length:9},()=>Array.from({length:9},()=>[]));sel=null;render();status.textContent='Entries cleared.'};
</script></body></html>
